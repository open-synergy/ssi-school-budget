scenarios:
  - name: "Contribution Allocation Percentage Split Two Units No Override"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Alloc 1"
          code: "GTA1"
          sequence: 10

      - step: "Setup - create branch"
        action: "create"
        model: "school_branch"
        save_as: "branch"
        values:
          name: "Branch Alloc 1"
          code: "BRA1"

      - step: "Setup - create school A"
        action: "create"
        model: "school"
        save_as: "school_a"
        values:
          name: "School Alloc 1A"
          code: "SCHA1A"
          grade_type_id: "EVAL: registry['grade_type'].id"
          branch_id: "EVAL: registry['branch'].id"

      - step: "Setup - create school B"
        action: "create"
        model: "school"
        save_as: "school_b"
        values:
          name: "School Alloc 1B"
          code: "SCHA1B"
          grade_type_id: "EVAL: registry['grade_type'].id"
          branch_id: "EVAL: registry['branch'].id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year Alloc 1"
          code: "AYA1"
          date_start: "2025-07-01"
          date_end: "2026-06-30"

      - step: "Create branch budget (parent)"
        action: "create"
        model: "school_budget"
        save_as: "budget_branch"
        values:
          org_type: "branch"
          branch_id: "EVAL: registry['branch'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"

      - step: "Create unit budget A"
        action: "create"
        model: "school_budget"
        save_as: "budget_a"
        values:
          org_type: "unit"
          school_id: "EVAL: registry['school_a'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"

      - step: "Create unit budget B"
        action: "create"
        model: "school_budget"
        save_as: "budget_b"
        values:
          org_type: "unit"
          school_id: "EVAL: registry['school_b'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"

      - step: "Create contribution allocation A (new=20, total=40)"
        action: "create"
        model: "school_budget_contribution_allocation"
        save_as: "alloc_a"
        values:
          parent_budget_id: "EVAL: registry['budget_branch'].id"
          child_budget_id: "EVAL: registry['budget_a'].id"
          new_student_count: 20
          total_student_count: 40

      - step: "Create contribution allocation B (new=30, total=60)"
        action: "create"
        model: "school_budget_contribution_allocation"
        save_as: "alloc_b"
        values:
          parent_budget_id: "EVAL: registry['budget_branch'].id"
          child_budget_id: "EVAL: registry['budget_b'].id"
          new_student_count: 30
          total_student_count: 60

      - step: "Assert pct_up split 0.4/0.6"
        action: "assert"
        target: "alloc_a"
        asserts:
          pct_up:
            type: "value"
            expected: 0.4

      - step: "Assert pct_up for B"
        action: "assert"
        target: "alloc_b"
        asserts:
          pct_up:
            type: "value"
            expected: 0.6

      - step: "Assert pct_us uses total_student_count (equal split here too)"
        action: "assert"
        target: "alloc_a"
        asserts:
          pct_us:
            type: "value"
            expected: 0.4

      - step: "Setup - create school C"
        action: "create"
        model: "school"
        save_as: "school_c"
        values:
          name: "School Alloc 1C"
          code: "SCHA1C"
          grade_type_id: "EVAL: registry['grade_type'].id"
          branch_id: "EVAL: registry['branch'].id"

      - step: "Create unit budget C"
        action: "create"
        model: "school_budget"
        save_as: "budget_c"
        values:
          org_type: "unit"
          school_id: "EVAL: registry['school_c'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"

      - step: "Add third allocation C with UP override 0.5 (new=50)"
        action: "create"
        model: "school_budget_contribution_allocation"
        save_as: "alloc_c"
        values:
          parent_budget_id: "EVAL: registry['budget_branch'].id"
          child_budget_id: "EVAL: registry['budget_c'].id"
          new_student_count: 50
          total_student_count: 50
          is_pct_up_overridden: true
          override_pct_up: 0.5

      - step: "Invalidate cache before re-assert pct_up with override mixed in"
        action: "call"
        target: "alloc_a"
        method: "invalidate_cache"

      - step: "Assert pct_up A becomes 0.2 (remaining 0.5 split 20:30)"
        action: "assert"
        target: "alloc_a"
        asserts:
          pct_up:
            type: "value"
            expected: 0.2

      - step: "Invalidate cache for B"
        action: "call"
        target: "alloc_b"
        method: "invalidate_cache"

      - step: "Assert pct_up B becomes 0.3"
        action: "assert"
        target: "alloc_b"
        asserts:
          pct_up:
            type: "value"
            expected: 0.3

      - step: "Assert pct_up C keeps override 0.5"
        action: "assert"
        target: "alloc_c"
        asserts:
          pct_up:
            type: "value"
            expected: 0.5

  - name: "Sync Contribution Allocation Creates Rows Without Overwriting Override"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Alloc 2"
          code: "GTA2"
          sequence: 10

      - step: "Setup - create branch"
        action: "create"
        model: "school_branch"
        save_as: "branch"
        values:
          name: "Branch Alloc 2"
          code: "BRA2"

      - step: "Setup - create school A"
        action: "create"
        model: "school"
        save_as: "school_a"
        values:
          name: "School Alloc 2A"
          code: "SCHA2A"
          grade_type_id: "EVAL: registry['grade_type'].id"
          branch_id: "EVAL: registry['branch'].id"

      - step: "Setup - create school B"
        action: "create"
        model: "school"
        save_as: "school_b"
        values:
          name: "School Alloc 2B"
          code: "SCHA2B"
          grade_type_id: "EVAL: registry['grade_type'].id"
          branch_id: "EVAL: registry['branch'].id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year Alloc 2"
          code: "AYA2"
          date_start: "2025-07-01"
          date_end: "2026-06-30"

      - step: "Create branch budget (parent)"
        action: "create"
        model: "school_budget"
        save_as: "budget_branch"
        values:
          org_type: "branch"
          branch_id: "EVAL: registry['branch'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"

      - step: "Create unit budget A"
        action: "create"
        model: "school_budget"
        save_as: "budget_a"
        values:
          org_type: "unit"
          school_id: "EVAL: registry['school_a'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"
          new_student_count: 15

      - step: "Create unit budget B"
        action: "create"
        model: "school_budget"
        save_as: "budget_b"
        values:
          org_type: "unit"
          school_id: "EVAL: registry['school_b'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"
          new_student_count: 25

      - step: "Create manual allocation A with override before sync"
        action: "create"
        model: "school_budget_contribution_allocation"
        save_as: "alloc_a"
        values:
          parent_budget_id: "EVAL: registry['budget_branch'].id"
          child_budget_id: "EVAL: registry['budget_a'].id"
          is_pct_up_overridden: true
          override_pct_up: 0.9

      - step: "Sync contribution allocation"
        action: "call"
        target: "budget_branch"
        method: "action_sync_contribution_allocation"

      - step: "Assert two allocation rows exist"
        action: "search"
        model: "school_budget_contribution_allocation"
        domain:
          - ["parent_budget_id", "=", "EVAL: registry['budget_branch'].id"]
        save_as: "check_allocations"
        expect_count: 2

      - step: "Invalidate cache before assert override preserved"
        action: "call"
        target: "alloc_a"
        method: "invalidate_cache"

      - step: "Assert override on A preserved after sync"
        action: "assert"
        target: "alloc_a"
        asserts:
          is_pct_up_overridden:
            type: "value"
            expected: true
          override_pct_up:
            type: "value"
            expected: 0.9

  - name: "Parent Expense Allocation On Branch Succeeds"
    steps:
      - step: "Setup - create branch"
        action: "create"
        model: "school_branch"
        save_as: "branch"
        values:
          name: "Branch Alloc 3"
          code: "BRA3"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year Alloc 3"
          code: "AYA3"
          date_start: "2025-07-01"
          date_end: "2026-06-30"

      - step: "Setup - create expense category"
        action: "create"
        model: "school_budget_expense_category"
        save_as: "expense_category"
        values:
          name: "Expense Alloc 3"
          code: "5110.50"

      - step: "Create branch budget"
        action: "create"
        model: "school_budget"
        save_as: "budget_branch"
        values:
          org_type: "branch"
          branch_id: "EVAL: registry['branch'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"

      - step: "Create parent expense allocation"
        action: "create"
        model: "school_budget_parent_expense_allocation"
        save_as: "pea"
        values:
          budget_id: "EVAL: registry['budget_branch'].id"
          expense_category_id: "EVAL: registry['expense_category'].id"
          affects_up: true

      - step: "Assert allocation created"
        action: "assert"
        target: "pea"
        asserts:
          affects_up:
            type: "value"
            expected: true
