scenarios:
  - name: "Simulate Generates Income And Expense Results With Identity Check"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Result 1"
          code: "GTR1"
          sequence: 10

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade Result 1"
          code: "GR1"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create branch"
        action: "create"
        model: "school_branch"
        save_as: "branch"
        values:
          name: "Branch Result 1"
          code: "BRR1"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Result 1"
          code: "SCHR1"
          grade_type_id: "EVAL: registry['grade_type'].id"
          branch_id: "EVAL: registry['branch'].id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year Result 1"
          code: "AYR1"
          date_start: "2025-07-01"
          date_end: "2026-06-30"

      - step: "Setup - create UP-component expense category"
        action: "create"
        model: "school_budget_expense_category"
        save_as: "expense_category_up"
        values:
          name: "UP Component Result 1"
          code: "5130.30"
          is_up_component: true

      - step: "Setup - create simulated UP income category"
        action: "create"
        model: "school_budget_income_category"
        save_as: "income_category_up"
        values:
          name: "Simulated UP Result 1"
          code: "4110.30"
          calc_method: "simulated_up"

      - step: "Setup - create target income category for direct income"
        action: "create"
        model: "school_budget_income_category"
        save_as: "target_income_category"
        values:
          name: "Direct Income Target Result 1"
          code: "4120.31"
          calc_method: "from_expense"

      - step: "Setup - create direct income expense category"
        action: "create"
        model: "school_budget_expense_category"
        save_as: "direct_income_expense_category"
        values:
          name: "Direct Income Expense Result 1"
          code: "5140.31"
          is_direct_income: true
          maps_to_income_category_id: "EVAL: registry['target_income_category'].id"

      - step: "Create branch budget (parent)"
        action: "create"
        model: "school_budget"
        save_as: "budget_branch"
        values:
          org_type: "branch"
          branch_id: "EVAL: registry['branch'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"

      - step: "Create unit budget"
        action: "create"
        model: "school_budget"
        save_as: "budget_unit"
        values:
          org_type: "unit"
          school_id: "EVAL: registry['school'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"
          new_student_count: 20

      - step: "Create assumption line for unit"
        action: "create"
        model: "school_budget_assumption_line"
        save_as: "assumption_line"
        values:
          budget_id: "EVAL: registry['budget_unit'].id"
          grade_id: "EVAL: registry['grade'].id"
          student_count: 50

      - step: "Create UP-component expense line on unit"
        action: "create"
        model: "school_budget_expense_line"
        save_as: "expense_line_up"
        values:
          budget_id: "EVAL: registry['budget_unit'].id"
          expense_category_id: "EVAL: registry['expense_category_up'].id"
          foundation: 40000000

      - step: "Create direct income expense line on unit (foundation and bos both set)"
        action: "create"
        model: "school_budget_expense_line"
        save_as: "expense_line_direct"
        values:
          budget_id: "EVAL: registry['budget_unit'].id"
          expense_category_id: "EVAL: registry['direct_income_expense_category'].id"
          foundation: 10000000
          bos: 3000000

      - step: "Mark branch UP-component category as affecting UP"
        action: "create"
        model: "school_budget_parent_expense_allocation"
        save_as: "pea"
        values:
          budget_id: "EVAL: registry['budget_branch'].id"
          expense_category_id: "EVAL: registry['expense_category_up'].id"
          affects_up: true

      - step: "Create branch expense line under UP-component category"
        action: "create"
        model: "school_budget_expense_line"
        save_as: "branch_expense_line"
        values:
          budget_id: "EVAL: registry['budget_branch'].id"
          expense_category_id: "EVAL: registry['expense_category_up'].id"
          foundation: 50000000

      - step: "Register unit as contributor with pct_up override 1.0"
        action: "create"
        model: "school_budget_contribution_allocation"
        save_as: "contribution"
        values:
          parent_budget_id: "EVAL: registry['budget_branch'].id"
          child_budget_id: "EVAL: registry['budget_unit'].id"
          is_pct_up_overridden: true
          override_pct_up: 1.0

      - step: "Simulate unit budget"
        action: "call"
        target: "budget_unit"
        method: "action_simulate"

      - step: "Simulate branch budget"
        action: "call"
        target: "budget_branch"
        method: "action_simulate"

      - step: "Invalidate cache before assert"
        action: "call"
        target: "budget_unit"
        method: "invalidate_cache"

      - step: "Assert simulated UP income result equals total_up_revenue"
        action: "search"
        model: "school_budget_income_result"
        domain:
          - ["budget_id", "=", "EVAL: registry['budget_unit'].id"]
          - ["source", "=", "simulated_up"]
          - ["amount", "=", "EVAL: registry['budget_unit'].total_up_revenue"]
        save_as: "check_simulated_up_result"
        expect_count: 1

      - step: "Assert direct income result uses foundation only (not bos)"
        action: "search"
        model: "school_budget_income_result"
        domain:
          - ["budget_id", "=", "EVAL: registry['budget_unit'].id"]
          - ["source", "=", "direct_income"]
          - ["amount", "=", 10000000.0]
        save_as: "check_direct_income_result"
        expect_count: 1

      - step: "Assert allocated UP expense result exists on unit"
        action: "search"
        model: "school_budget_expense_result"
        domain:
          - ["budget_id", "=", "EVAL: registry['budget_unit'].id"]
          - ["source", "=", "allocated_up"]
          - ["amount_total", "=", 50000000.0]
        save_as: "check_allocated_up_expense"
        expect_count: 1

      - step: "Assert contribution income results exist on branch"
        action: "search"
        model: "school_budget_income_result"
        domain:
          - ["budget_id", "=", "EVAL: registry['budget_branch'].id"]
          - ["source", "in", ["contribution_up", "contribution_us"]]
        save_as: "check_contribution_results"
        expect_count: 2

      - step: "Assert consolidation identity: allocated expense on unit equals contribution_up income on branch"
        action: "search"
        model: "school_budget_income_result"
        domain:
          - ["budget_id", "=", "EVAL: registry['budget_branch'].id"]
          - ["source", "=", "contribution_up"]
          - ["amount", "=", 50000000.0]
        save_as: "check_identity"
        expect_count: 1

      - step: "Simulate unit budget again (idempotency)"
        action: "call"
        target: "budget_unit"
        method: "action_simulate"

      - step: "Assert idempotent: allocated UP row count still 1"
        action: "search"
        model: "school_budget_expense_result"
        domain:
          - ["budget_id", "=", "EVAL: registry['budget_unit'].id"]
          - ["source", "=", "allocated_up"]
        save_as: "check_idempotent"
        expect_count: 1

  - name: "Grade Based Direct Income Fallback"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Result 2"
          code: "GTR2"
          sequence: 10

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade Result 2"
          code: "GR2"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Result 2"
          code: "SCHR2"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year Result 2"
          code: "AYR2"
          date_start: "2025-07-01"
          date_end: "2026-06-30"

      - step: "Setup - create grade-based target income category"
        action: "create"
        model: "school_budget_income_category"
        save_as: "target_income_category"
        values:
          name: "Grade Based Target Result 2"
          code: "4120.32"
          calc_method: "grade_based"

      - step: "Setup - create direct income expense category"
        action: "create"
        model: "school_budget_expense_category"
        save_as: "direct_income_expense_category"
        values:
          name: "Direct Income Expense Result 2"
          code: "5140.32"
          is_direct_income: true
          maps_to_income_category_id: "EVAL: registry['target_income_category'].id"

      - step: "Create unit budget"
        action: "create"
        model: "school_budget"
        save_as: "budget"
        values:
          org_type: "unit"
          school_id: "EVAL: registry['school'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"

      - step: "Create direct income expense line"
        action: "create"
        model: "school_budget_expense_line"
        save_as: "expense_line"
        values:
          budget_id: "EVAL: registry['budget'].id"
          expense_category_id: "EVAL: registry['direct_income_expense_category'].id"
          foundation: 5000000

      - step: "Create grade allocation totaling 12,000,000"
        action: "create"
        model: "school_budget_expense_grade_allocation"
        save_as: "grade_allocation"
        values:
          line_id: "EVAL: registry['expense_line'].id"
          grade_id: "EVAL: registry['grade'].id"
          amount: 12000000

      - step: "Simulate"
        action: "call"
        target: "budget"
        method: "action_simulate"

      - step: "Assert grade-based amount used instead of foundation"
        action: "search"
        model: "school_budget_income_result"
        domain:
          - ["budget_id", "=", "EVAL: registry['budget'].id"]
          - ["source", "=", "direct_income"]
          - ["amount", "=", 12000000.0]
        save_as: "check_grade_based"
        expect_count: 1
