scenarios:
  - name: "Create Analytic Account Idempotent And Auto Assigned On Budget"
    options: {auto_refresh: true}
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type AA 1"
          code: "GTAA1"
          sequence: 10

      - step: "Setup - create branch"
        action: "create"
        model: "school_branch"
        save_as: "branch"
        values:
          name: "Branch AA 1"
          code: "BRAA1"

      - step: "Setup - create school A"
        action: "create"
        model: "school"
        save_as: "school_a"
        values:
          name: "School AA 1A"
          code: "SCHAA1A"
          grade_type_id: "EVAL: registry['grade_type'].id"
          branch_id: "EVAL: registry['branch'].id"

      - step: "Setup - create school B"
        action: "create"
        model: "school"
        save_as: "school_b"
        values:
          name: "School AA 1B"
          code: "SCHAA1B"
          grade_type_id: "EVAL: registry['grade_type'].id"
          branch_id: "EVAL: registry['branch'].id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year AA 1"
          code: "AYAA1"
          date_start: "2025-07-01"
          date_end: "2026-06-30"

      - step: "Create analytic account for branch"
        action: "call"
        target: "branch"
        method: "action_create_analytic_account"

      - step: "Assert branch analytic_account_id is set"
        action: "assert"
        target: "branch"
        asserts:
          analytic_account_id:
            type: "value"
            operator: "is_truthy"

      - step: "Save branch's analytic account for later comparison"
        action: "search"
        model: "account.analytic.account"
        domain:
          - ["id", "=", "EVAL: registry['branch'].analytic_account_id.id"]
        save_as: "aa_first"
        expect_count: 1

      - step: "Create analytic account for branch again (idempotent)"
        action: "call"
        target: "branch"
        method: "action_create_analytic_account"

      - step: "Assert branch still points to the same analytic account"
        action: "search"
        model: "school_branch"
        domain:
          - ["id", "=", "EVAL: registry['branch'].id"]
          - ["analytic_account_id", "=", "EVAL: registry['aa_first'].id"]
        save_as: "check_idempotent_aa"
        expect_count: 1

      - step: "Create analytic account for unit A"
        action: "call"
        target: "school_a"
        method: "action_create_analytic_account"

      - step: "Create analytic account for unit B"
        action: "call"
        target: "school_b"
        method: "action_create_analytic_account"

      - step: "Assert unit A and unit B have different analytic accounts"
        action: "search"
        model: "school"
        domain:
          - ["id", "=", "EVAL: registry['school_a'].id"]
          - [
              "analytic_account_id",
              "!=",
              "EVAL: registry['school_b'].analytic_account_id.id",
            ]
        save_as: "check_different_aa"
        expect_count: 1

      - step: "Create unit A budget"
        action: "create"
        model: "school_budget"
        save_as: "budget_a"
        values:
          org_type: "unit"
          school_id: "EVAL: registry['school_a'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"
          # T-05: this scenario runs with auto_refresh, so budget_a is
          # re-read under as_user below; without an explicit user_id the
          # record is owned by superuser and school_budget_internal_user_rule
          # rejects the read.
          user_id: "REF: base.user_admin"

      - step: "Assert budget A analytic_account_id matches school A's"
        action: "search"
        model: "school_budget"
        domain:
          - ["id", "=", "EVAL: registry['budget_a'].id"]
          - [
              "analytic_account_id",
              "=",
              "EVAL: registry['school_a'].analytic_account_id.id",
            ]
        save_as: "check_budget_aa"
        expect_count: 1

      - step: "Create branch budget"
        action: "create"
        model: "school_budget"
        save_as: "budget_branch"
        values:
          org_type: "branch"
          branch_id: "EVAL: registry['branch'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"

      - step: "Assert branch budget analytic_account_id matches branch's"
        action: "search"
        model: "school_budget"
        domain:
          - ["id", "=", "EVAL: registry['budget_branch'].id"]
          - [
              "analytic_account_id",
              "=",
              "EVAL: registry['branch'].analytic_account_id.id",
            ]
        save_as: "check_branch_budget_aa"
        expect_count: 1

      - step: "Confirm unit A budget succeeds since school A has an analytic account"
        action: "call"
        target: "budget_a"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Reassigning unit B's analytic account to unit A must be rejected"
        action: "write"
        target: "school_a"
        expect_error:
          type: "ValidationError"
          message_contains: "is already used by another company,"
        values:
          analytic_account_id: "EVAL: registry['school_b'].analytic_account_id.id"

      - step: "Assigning unit A's analytic account to the branch must be rejected"
        action: "write"
        target: "branch"
        expect_error:
          type: "ValidationError"
          message_contains: "is already used by another company,"
        values:
          analytic_account_id: "EVAL: registry['school_a'].analytic_account_id.id"

      - step: "Assigning unit A's analytic account to the company must be rejected"
        action: "write"
        target: "company"
        expect_error:
          type: "ValidationError"
          message_contains: "is already used by another company,"
        values:
          school_analytic_account_id:
            "EVAL: registry['school_a'].analytic_account_id.id"

  - name: "Confirm Budget Without Analytic Account Rejected"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type AA 2"
          code: "GTAA2"
          sequence: 10

      - step: "Setup - create school (no analytic account created)"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School AA 2"
          code: "SCHAA2"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year AA 2"
          code: "AYAA2"
          date_start: "2025-07-01"
          date_end: "2026-06-30"

      - step: "Create unit budget"
        action: "create"
        model: "school_budget"
        save_as: "budget"
        values:
          org_type: "unit"
          school_id: "EVAL: registry['school'].id"
          academic_year_id: "EVAL: registry['academic_year'].id"

      - step:
          "Confirming a budget whose organization has no analytic account must be
          rejected"
        action: "call"
        target: "budget"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "organization of this budget has no analytic account"
